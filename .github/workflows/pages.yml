# Deploy เว็บขึ้น GitHub Pages ทุกครั้งที่ push เข้า master (หรือกดรันเองในแท็บ Actions)
# เปิดใช้ครั้งแรก: repo → Settings → Pages → Source = "GitHub Actions"
# ไม่อัปโหลด sql/ tests/ docs/ .github/ (ไม่จำเป็นต่อหน้าเว็บ)
name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (money.js)
        run: node --test tests/money.test.js
      - name: Build site folder
        run: |
          mkdir _site
          cp *.html _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
